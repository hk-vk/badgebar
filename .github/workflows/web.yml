name: Website

on:
  push:
    branches: [main]
    paths: ['apps/web/**', 'pnpm-lock.yaml', '.github/workflows/web.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:web
        env:
          # Served from its own domain (set in the repo's Pages settings), so from the root.
          SITE_URL: https://badgebar.hari.works
          SITE_BASE: /
          PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
      # Releases carry their signed feed as an asset. Keeping it with the release makes the
      # feed and archive atomic; every website deployment picks up the latest published feed.
      - name: Include the latest update feed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          assets="$(gh release view --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')"
          if printf '%s\n' "$assets" | grep -Fxq appcast.xml; then
            gh release download --repo "$GITHUB_REPOSITORY" --pattern appcast.xml --dir apps/web/dist --clobber
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
