name: macOS app

on:
  push:
    paths: ['apps/macos/**', '.github/workflows/macos.yml']
  pull_request:
    paths: ['apps/macos/**', '.github/workflows/macos.yml']

jobs:
  test:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: apps/macos
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test
