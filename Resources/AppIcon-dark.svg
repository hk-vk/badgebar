<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    BadgeBar icon, dark appearance (same geometry as AppIcon.svg). Everything is derived from the macOS icon grid:
    - Body: 824 × 824 squircle at (100, 100), corner radius 185 (0.2245 × 824).
    - Tile: 400 × 400 with the same corner ratio (r = 0.2245 × 400 ≈ 90), stroke 56.
    - Badge: centered exactly on the 45° point of the tile's top-right corner arc,
      radius 96, with a 34pt knockout gap cut from the tile's stroke.
    - The group is shifted (+29, −9) so the tile and badge together sit at the optical center.
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A3A3D"/>
      <stop offset="1" stop-color="#1C1C1E"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF7A5C"/>
      <stop offset="1" stop-color="#F0483A"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
    <!-- Cuts a ring out of the tile's stroke around the badge. -->
    <mask id="knockout">
      <rect width="1024" height="1024" fill="#FFFFFF"/>
      <circle cx="635.6" cy="368.4" r="130" fill="#000000"/>
    </mask>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="101" y="101" width="822" height="822" rx="184" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="2"/>

  <g transform="translate(29 -9)">
    <rect x="262" y="342" width="400" height="400" rx="90"
          fill="none" stroke="#F5F5F7" stroke-width="56" mask="url(#knockout)"/>
    <circle cx="635.6" cy="368.4" r="96" fill="url(#badge)"/>
  </g>
</svg>
